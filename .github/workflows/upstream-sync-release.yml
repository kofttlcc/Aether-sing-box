name: Upstream Sync and Release

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_republish:
        description: 'Force rebuild and republish release assets from current HEAD even if already synced'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: upstream-sync-release
  cancel-in-progress: false

jobs:
  sync-and-release:
    name: Sync Upstream and Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
      FORCE_REPUBLISH: ${{ (inputs.force_republish == true || github.event.inputs.force_republish == 'true') && 'true' || 'false' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}

      - name: Discover Latest Upstream Stable Release
        id: discover
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          if [ -n "${GH_TOKEN:-}" ] && [ "${GH_TOKEN}" != "GHA_PLACEHOLDER" ]; then
            RELEASE_JSON="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${API_URL}")"
          else
            RELEASE_JSON="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${API_URL}")"
          fi

          printf '%s' "${RELEASE_JSON}" | jq -e '
            type == "object"
            and (.tag_name | type == "string" and length > 0)
            and (.draft | type == "boolean")
            and (.prerelease | type == "boolean")
          ' >/dev/null

          IS_DRAFT="$(printf '%s' "${RELEASE_JSON}" | jq -r '.draft')"
          IS_PRERELEASE="$(printf '%s' "${RELEASE_JSON}" | jq -r '.prerelease')"
          UPSTREAM_TAG="$(printf '%s' "${RELEASE_JSON}" | jq -r '.tag_name')"

          if [ "${IS_DRAFT}" != "false" ] || [ "${IS_PRERELEASE}" != "false" ]; then
            echo "Skipping upstream release ${UPSTREAM_TAG}: draft=${IS_DRAFT}, prerelease=${IS_PRERELEASE}"
            echo "should_sync=false" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "SHOULD_SYNC=false" >> "${GITHUB_ENV:-/dev/null}"
            exit 0
          fi

          if ! [[ "${UPSTREAM_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-stable upstream tag ${UPSTREAM_TAG}: must match ^v[0-9]+\.[0-9]+\.[0-9]+$"
            echo "should_sync=false" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "SHOULD_SYNC=false" >> "${GITHUB_ENV:-/dev/null}"
            exit 0
          fi

          if [ "${FORCE_REPUBLISH:-false}" = "true" ] && [ -f constant/version.go ]; then
            CURRENT_BASE="$(sed -n 's/^[[:space:]]*var Version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*"/\1/p' constant/version.go)"
            if [ -n "${CURRENT_BASE}" ]; then
              UPSTREAM_TAG="v${CURRENT_BASE}"
            fi
          fi

          UPSTREAM_VER="${UPSTREAM_TAG#v}"
          RELEASE_TAG="${UPSTREAM_TAG}-Custom-Aether"

          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "${GITHUB_ENV:-/dev/null}"
          echo "UPSTREAM_VER=${UPSTREAM_VER}" >> "${GITHUB_ENV:-/dev/null}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV:-/dev/null}"
          echo "upstream_tag=${UPSTREAM_TAG}" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "upstream_ver=${UPSTREAM_VER}" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "should_sync=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "SHOULD_SYNC=true" >> "${GITHUB_ENV:-/dev/null}"
          echo "Discovered upstream stable release: ${UPSTREAM_TAG} -> ${RELEASE_TAG}"

      - name: Fetch Upstream Tag and Check Idempotency
        id: idempotency
        if: steps.discover.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM_REPO_URL="https://github.com/SagerNet/sing-box.git"
          UPSTREAM_VER="${UPSTREAM_VER:-${UPSTREAM_TAG#v}}"
          RELEASE_TAG="${RELEASE_TAG:-${UPSTREAM_TAG}-Custom-Aether}"
          EXPECTED_AMD64="sing-box-${UPSTREAM_VER}-Custom-Aether-linux-amd64.tar.gz"
          EXPECTED_ARM64="sing-box-${UPSTREAM_VER}-Custom-Aether-linux-arm64.tar.gz"
          if ! git rev-parse -q --verify "refs/tags/${UPSTREAM_TAG}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags --force "${UPSTREAM_REPO_URL}" "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          fi

          IS_ANCESTOR=false
          if git merge-base --is-ancestor "refs/tags/${UPSTREAM_TAG}^{commit}" HEAD >/dev/null 2>&1; then
            IS_ANCESTOR=true
          fi

          RELEASE_EXISTS=false
          TARGET_REPO="${GH_REPO:-${GITHUB_REPOSITORY:-}}"
          GH_REPO_ARGS=()
          if [ -n "${TARGET_REPO}" ]; then
            GH_REPO_ARGS=(--repo "${TARGET_REPO}")
          fi
          if command -v gh >/dev/null 2>&1; then
            if RELEASE_VIEW_OUT="$(gh release view "${RELEASE_TAG}" ${GH_REPO_ARGS[@]+"${GH_REPO_ARGS[@]}"} --json isDraft,assets 2>/dev/null)"; then
              if [ -z "${RELEASE_VIEW_OUT}" ] || printf '%s' "${RELEASE_VIEW_OUT}" | jq -e \
                --arg amd64 "${EXPECTED_AMD64}" \
                --arg arm64 "${EXPECTED_ARM64}" \
                '.isDraft == false and ((.assets // []) | map(.name) as $names | ($names | index($amd64) != null) and ($names | index($arm64) != null) and ($names | index("SHA256SUMS") != null))' \
                >/dev/null 2>&1; then
                RELEASE_EXISTS=true
              fi
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          elif git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          if [ "${FORCE_REPUBLISH:-false}" != "true" ] && [ "${IS_ANCESTOR}" = "true" ] && [ "${RELEASE_EXISTS}" = "true" ]; then
            echo "Already synced and released: ${UPSTREAM_TAG} is ancestor of HEAD and published release ${RELEASE_TAG} exists."
            echo "should_proceed=false" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "SHOULD_PROCEED=false" >> "${GITHUB_ENV:-/dev/null}"
            exit 0
          fi

          echo "Proceeding with sync and release for ${UPSTREAM_TAG} (ancestor=${IS_ANCESTOR}, release_exists=${RELEASE_EXISTS}, force_republish=${FORCE_REPUBLISH:-false})."
          echo "should_proceed=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "SHOULD_PROCEED=true" >> "${GITHUB_ENV:-/dev/null}"

      - name: Merge Upstream Tag and Preserve Workflows
        if: steps.idempotency.outputs.should_proceed == 'true'
        run: |
          set -euo pipefail
          UPSTREAM_REPO_URL="https://github.com/SagerNet/sing-box.git"
          if ! git rev-parse -q --verify "refs/tags/${UPSTREAM_TAG}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags --force "${UPSTREAM_REPO_URL}" "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          fi

          IS_ANCESTOR=false
          if git merge-base --is-ancestor "refs/tags/${UPSTREAM_TAG}^{commit}" HEAD >/dev/null 2>&1; then
            IS_ANCESTOR=true
          fi

          if [ "${IS_ANCESTOR}" != "true" ]; then
            if ! git config user.name >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
            fi
            if ! git config user.email >/dev/null 2>&1; then
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            fi
            git merge --no-commit --no-ff "refs/tags/${UPSTREAM_TAG}" || true

            # Always preserve fork .github/workflows/ identically to pre-merge HEAD
            # (prevents merge conflicts and GITHUB_TOKEN workflows-scope push rejection).
            git reset -q HEAD -- .github/workflows/ 2>/dev/null || true
            if git ls-tree -r --name-only HEAD -- .github/workflows/ | grep -q .; then
              git checkout HEAD -- .github/workflows/
            fi
            git clean -fd .github/workflows/ 2>/dev/null || true

            # Resolve docs/schema.json conflict in favor of HEAD before regeneration.
            if [ -n "$(git diff --name-only --diff-filter=U -- docs/schema.json)" ]; then
              if git cat-file -e HEAD:docs/schema.json >/dev/null 2>&1; then
                git checkout HEAD -- docs/schema.json
              else
                git checkout --theirs -- docs/schema.json
              fi
            fi

            # Resolve constant/version.go conflict in favor of HEAD before setting target version.
            if [ -n "$(git diff --name-only --diff-filter=U -- constant/version.go)" ]; then
              if git cat-file -e HEAD:constant/version.go >/dev/null 2>&1; then
                git checkout HEAD -- constant/version.go
              else
                git checkout --theirs -- constant/version.go
              fi
            fi

            UNMERGED="$(git diff --name-only --diff-filter=U)"
            if [ -n "${UNMERGED}" ]; then
              echo "::error::Unresolved merge conflicts in source files:"
              printf '%s\n' "${UNMERGED}"
              git merge --abort || true
              exit 1
            fi

            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
              echo "::error::git merge did not enter a merge state for ${UPSTREAM_TAG}"
              exit 1
            fi
          fi

          WORKFLOW_DIFF="$(git diff HEAD --name-only -- .github/workflows/)"
          WORKFLOW_CACHED_DIFF="$(git diff --cached HEAD --name-only -- .github/workflows/)"
          if [ -n "${WORKFLOW_DIFF}" ] || [ -n "${WORKFLOW_CACHED_DIFF}" ]; then
            echo "::error::Unexpected diff in .github/workflows/ after preservation:"
            printf '%s\n%s\n' "${WORKFLOW_DIFF}" "${WORKFLOW_CACHED_DIFF}"
            git merge --abort || true
            exit 1
          fi

      - name: Setup Go Environment
        if: steps.idempotency.outputs.should_proceed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Update Version and Regenerate Schema
        if: steps.idempotency.outputs.should_proceed == 'true'
        run: |
          set -euo pipefail
          UPSTREAM_VER="${UPSTREAM_TAG#v}"
          CUSTOM_VERSION="${UPSTREAM_VER}-Custom-Aether"

          if [ -f constant/version.go ]; then
            sed "s/^var Version = \".*\"/var Version = \"${CUSTOM_VERSION}\"/" constant/version.go > constant/version.go.tmp
            mv constant/version.go.tmp constant/version.go
          else
            mkdir -p constant
            printf 'package constant\n\nvar Version = "%s"\n' "${CUSTOM_VERSION}" > constant/version.go
          fi

          if ! grep -q "var Version = \"${CUSTOM_VERSION}\"" constant/version.go; then
            echo "::error::Failed to update constant/version.go to ${CUSTOM_VERSION}"
            git merge --abort || true
            exit 1
          fi

          if [ -f cmd/sing-box/cmd_schema.go ]; then
            LDFLAGS_SHARED=""
            if [ -f release/LDFLAGS ]; then
              LDFLAGS_SHARED="$(cat release/LDFLAGS)"
            fi
            BUILD_TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0"
            TAGS_FILE="release/DEFAULT_BUILD_TAGS_OTHERS"
            if [ -f "${TAGS_FILE}" ]; then
              BUILD_TAGS="$(tr -d ' \t\r\n' < "${TAGS_FILE}")"
            fi
            echo "BUILD_TAGS=${BUILD_TAGS}" >> "${GITHUB_ENV:-/dev/null}"
            echo "LDFLAGS_SHARED=${LDFLAGS_SHARED}" >> "${GITHUB_ENV:-/dev/null}"
            mkdir -p docs
            go run \
              -tags "${BUILD_TAGS}" \
              -ldflags "${LDFLAGS_SHARED}" \
              ./cmd/sing-box schema > docs/schema.json.tmp
            if [ -s docs/schema.json.tmp ]; then
              mv docs/schema.json.tmp docs/schema.json
            else
              rm -f docs/schema.json.tmp
            fi
          fi

      - name: Run Mandatory -race Test Gate
        if: steps.idempotency.outputs.should_proceed == 'true'
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          TEST_TAGS="${BUILD_TAGS:-with_clash_api,badlinkname,tfogo_checklinkname0}"
          TEST_LDFLAGS="${LDFLAGS_SHARED:-}"
          if [ -z "${TEST_LDFLAGS}" ] && [ -f release/LDFLAGS ]; then
            TEST_LDFLAGS="$(cat release/LDFLAGS)"
          fi
          CGO_ENABLED=1 go test -race -count=1 ./cmd/sing-box/... ./option/... ./schema/... ./protocol/aether/... ./route/... ./daemon/... ./protocol/group/... ./experimental/clashapi/... -tags "${TEST_TAGS}" -ldflags "${TEST_LDFLAGS}" -timeout 30m

      - name: Build and Package Multi-Arch Static Binaries
        if: steps.idempotency.outputs.should_proceed == 'true'
        run: |
          set -euo pipefail
          UPSTREAM_VER="${UPSTREAM_TAG#v}"
          CUSTOM_VERSION="${UPSTREAM_VER}-Custom-Aether"
          LDFLAGS_SHARED=""
          if [ -f release/LDFLAGS ]; then
            LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          fi
          BUILD_TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0"
          TAGS_FILE="release/DEFAULT_BUILD_TAGS_OTHERS"
          if [ -f "${TAGS_FILE}" ]; then
            BUILD_TAGS="$(tr -d ' \t\r\n' < "${TAGS_FILE}")"
          fi

          rm -rf dist
          mkdir -p dist

          for ARCH in amd64 arm64; do
            PKG_NAME="sing-box-${CUSTOM_VERSION}-linux-${ARCH}"
            PKG_DIR="dist/${PKG_NAME}"
            mkdir -p "${PKG_DIR}"

            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
              go build -v -trimpath \
                -tags "${BUILD_TAGS}" \
                -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${UPSTREAM_VER}-Custom-Aether' ${LDFLAGS_SHARED} -s -w -buildid=" \
                -o "${PKG_DIR}/sing-box" ./cmd/sing-box

            if [ "${ARCH}" = "amd64" ] && [ "$(uname -s)" = "Linux" ] && [ "$(uname -m)" = "x86_64" ] && [ -x "${PKG_DIR}/sing-box" ]; then
              "${PKG_DIR}/sing-box" version
            fi

            if [ -f LICENSE ]; then
              cp LICENSE "${PKG_DIR}/LICENSE"
            fi
            tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
            rm -rf "${PKG_DIR}"
          done

          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum *.tar.gz > SHA256SUMS
            else
              shasum -a 256 *.tar.gz > SHA256SUMS
            fi
          )

      - name: Commit Sync, Tag, Push, and Publish GitHub Release
        if: steps.idempotency.outputs.should_proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM_VER="${UPSTREAM_VER:-${UPSTREAM_TAG#v}}"
          RELEASE_TAG="${RELEASE_TAG:-${UPSTREAM_TAG}-Custom-Aether}"
          EXPECTED_AMD64="sing-box-${UPSTREAM_VER}-Custom-Aether-linux-amd64.tar.gz"
          EXPECTED_ARM64="sing-box-${UPSTREAM_VER}-Custom-Aether-linux-arm64.tar.gz"
          TARGET_REPO="${GH_REPO:-${GITHUB_REPOSITORY:-}}"
          GH_REPO_ARGS=()
          if [ -n "${TARGET_REPO}" ]; then
            GH_REPO_ARGS=(--repo "${TARGET_REPO}")
          fi

          if ! git config user.name >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
          fi
          if ! git config user.email >/dev/null 2>&1; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          # Final guard ensuring .github/workflows/ has zero diff against pre-merge HEAD.
          git reset -q HEAD -- .github/workflows/ 2>/dev/null || true
          if git ls-tree -r --name-only HEAD -- .github/workflows/ | grep -q .; then
            git checkout HEAD -- .github/workflows/
          fi
          git clean -fd .github/workflows/ 2>/dev/null || true

          git add -A
          git reset -q HEAD -- dist 2>/dev/null || true
          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1 || ! git diff --cached --quiet; then
            git commit -m "chore(sync): merge upstream sing-box ${UPSTREAM_TAG}"
          fi

          TARGET_BRANCH="$(git symbolic-ref --short HEAD 2>/dev/null || echo "${GITHUB_REF_NAME:-main}")"
          HEAD_SHA="$(git rev-parse HEAD)"

          # Detect existing GitHub Release (e.g., partial/draft release from an interrupted run).
          RELEASE_EXISTS_ON_GITHUB=false
          HAS_PUBLISHED_RELEASE=false
          if EXISTING_RELEASE_OUT="$(gh release view "${RELEASE_TAG}" ${GH_REPO_ARGS[@]+"${GH_REPO_ARGS[@]}"} --json isDraft,assets 2>/dev/null)"; then
            RELEASE_EXISTS_ON_GITHUB=true
            if [ -z "${EXISTING_RELEASE_OUT}" ] || printf '%s' "${EXISTING_RELEASE_OUT}" | jq -e \
              --arg amd64 "${EXPECTED_AMD64}" \
              --arg arm64 "${EXPECTED_ARM64}" \
              '.isDraft == false and ((.assets // []) | map(.name) as $names | ($names | index($amd64) != null) and ($names | index($arm64) != null) and ($names | index("SHA256SUMS") != null))' \
              >/dev/null 2>&1; then
              HAS_PUBLISHED_RELEASE=true
            fi
          fi

          # Inspect both local and remote tag state (catches remote-only or diverged orphaned tags).
          LOCAL_TAG_COMMIT=""
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            LOCAL_TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          fi
          REMOTE_TAG_COMMIT=""
          while IFS=$'\t' read -r sha ref; do
            if [ "${ref}" = "refs/tags/${RELEASE_TAG}^{}" ]; then
              REMOTE_TAG_COMMIT="${sha}"
            elif [ "${ref}" = "refs/tags/${RELEASE_TAG}" ] && [ -z "${REMOTE_TAG_COMMIT}" ]; then
              REMOTE_TAG_COMMIT="${sha}"
            fi
          done < <(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" 2>/dev/null || true)

          EXISTING_TAG_COMMIT="${REMOTE_TAG_COMMIT:-${LOCAL_TAG_COMMIT}}"
          if [ "${FORCE_REPUBLISH:-false}" != "true" ] && [ "${HAS_PUBLISHED_RELEASE}" = "true" ] && [ -n "${EXISTING_TAG_COMMIT}" ] && [ "${EXISTING_TAG_COMMIT}" != "${HEAD_SHA}" ]; then
            echo "::error::Published release ${RELEASE_TAG} already exists on ${TARGET_REPO:-origin} at ${EXISTING_TAG_COMMIT}; refusing to move tag to ${HEAD_SHA}"
            exit 1
          fi

          # Create or align annotated tag with HEAD (only move an existing orphaned tag when no complete published release exists, or when FORCE_REPUBLISH=true).
          NEED_TAG_PUSH=true
          FORCE_TAG_PUSH=false
          if [ "${REMOTE_TAG_COMMIT}" = "${HEAD_SHA}" ]; then
            NEED_TAG_PUSH=false
          elif [ -n "${REMOTE_TAG_COMMIT}" ] && [ "${REMOTE_TAG_COMMIT}" != "${HEAD_SHA}" ]; then
            git tag -fa "${RELEASE_TAG}" -m "Aether-sing-box ${RELEASE_TAG}"
            FORCE_TAG_PUSH=true
          elif [ -n "${LOCAL_TAG_COMMIT}" ] && [ "${LOCAL_TAG_COMMIT}" != "${HEAD_SHA}" ]; then
            git tag -fa "${RELEASE_TAG}" -m "Aether-sing-box ${RELEASE_TAG}"
            FORCE_TAG_PUSH=true
          elif [ -z "${LOCAL_TAG_COMMIT}" ]; then
            git tag -a "${RELEASE_TAG}" -m "Aether-sing-box ${RELEASE_TAG}"
          fi

          git push origin "HEAD:${TARGET_BRANCH}"
          if [ "${NEED_TAG_PUSH}" = "true" ]; then
            if [ "${FORCE_TAG_PUSH}" = "true" ]; then
              git push --force origin "refs/tags/${RELEASE_TAG}"
            else
              git push origin "refs/tags/${RELEASE_TAG}"
            fi
          fi

          RELEASE_TITLE="Aether-sing-box ${RELEASE_TAG}"
          RELEASE_NOTES="Automated upstream sync with SagerNet/sing-box ${UPSTREAM_TAG} (passed CGO_ENABLED=1 -race test gate)."

          if [ "${FORCE_REPUBLISH:-false}" != "true" ] && [ "${HAS_PUBLISHED_RELEASE}" = "true" ]; then
            echo "Published release ${RELEASE_TAG} already contains all expected assets; skipping release modification."
          elif [ "${RELEASE_EXISTS_ON_GITHUB}" = "true" ]; then
            gh release upload "${RELEASE_TAG}" \
              ${GH_REPO_ARGS[@]+"${GH_REPO_ARGS[@]}"} \
              --clobber \
              dist/*.tar.gz \
              dist/SHA256SUMS
            gh release edit "${RELEASE_TAG}" \
              ${GH_REPO_ARGS[@]+"${GH_REPO_ARGS[@]}"} \
              --draft=false \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_NOTES}"
          else
            gh release create "${RELEASE_TAG}" \
              ${GH_REPO_ARGS[@]+"${GH_REPO_ARGS[@]}"} \
              --verify-tag \
              dist/*.tar.gz \
              dist/SHA256SUMS \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_NOTES}"
          fi
          rm -rf dist
