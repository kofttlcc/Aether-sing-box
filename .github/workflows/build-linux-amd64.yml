name: Build sing-box (Linux x86_64)

on:
  push:
    branches: [ "main", "master", "testing", "dev/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "testing" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Resolve Version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^[[:space:]]*var Version = "\(.*\)"/\1/p' constant/version.go)"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Failed to resolve VERSION from GITHUB_REF_NAME or constant/version.go"
            exit 1
          fi
          echo "Resolved VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Run Unit and Race Tests
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race ./cmd/sing-box/... ./protocol/aether/...

      - name: Build sing-box (Linux amd64)
        run: |
          set -euo pipefail
          mkdir -p build/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -v -trimpath \
              -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,badlinkname,tfogo_checklinkname0" \
              -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' $(cat release/LDFLAGS) -s -w -buildid=" \
              -o build/sing-box-linux-amd64 ./cmd/sing-box
          ./build/sing-box-linux-amd64 version

      - name: Release Binary (GitHub Release)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aether-sing-box ${{ github.ref_name }} (Linux x86_64)"
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: build/sing-box-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: build/sing-box-linux-amd64
          retention-days: 7
