name: Build sing-box (Linux x86_64)

on:
  push:
    branches: [ "main", "master", "testing", "dev/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "testing" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Resolve Version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^[[:space:]]*var Version = "\(.*\)"/\1/p' constant/version.go)"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Failed to resolve VERSION from GITHUB_REF_NAME or constant/version.go"
            exit 1
          fi
          echo "Resolved VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Run Unit and Race Tests
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          BUILD_TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0"
          TAGS_FILE="release/DEFAULT_BUILD_TAGS_OTHERS"
          if [ -f "${TAGS_FILE}" ]; then
            BUILD_TAGS="$(tr -d ' \t\r\n' < "${TAGS_FILE}")"
          fi
          LDFLAGS_SHARED=""
          if [ -f release/LDFLAGS ]; then
            LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          fi
          go test -race -count=1 -tags "${BUILD_TAGS}" -ldflags "${LDFLAGS_SHARED}" ./cmd/sing-box/... ./route/... ./daemon/... ./protocol/aether/... ./protocol/group/... ./experimental/clashapi/... -timeout 30m

      - name: Build sing-box (Linux amd64 and arm64)
        run: |
          set -euo pipefail
          mkdir -p build/ dist/
          BUILD_TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0"
          TAGS_FILE="release/DEFAULT_BUILD_TAGS_OTHERS"
          if [ -f "${TAGS_FILE}" ]; then
            BUILD_TAGS="$(tr -d ' \t\r\n' < "${TAGS_FILE}")"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -v -trimpath \
              -tags "${BUILD_TAGS}" \
              -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' $(cat release/LDFLAGS) -s -w -buildid=" \
              -o build/sing-box-linux-amd64 ./cmd/sing-box
          ./build/sing-box-linux-amd64 version
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -v -trimpath \
              -tags "${BUILD_TAGS}" \
              -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' $(cat release/LDFLAGS) -s -w -buildid=" \
              -o build/sing-box-linux-arm64 ./cmd/sing-box
          for ARCH in amd64 arm64; do
            PKG_NAME="sing-box-${VERSION}-linux-${ARCH}"
            PKG_DIR="dist/${PKG_NAME}"
            mkdir -p "${PKG_DIR}"
            cp "build/sing-box-linux-${ARCH}" "${PKG_DIR}/sing-box"
            chmod 0755 "${PKG_DIR}/sing-box"
            if [ -f LICENSE ]; then
              cp LICENSE "${PKG_DIR}/LICENSE"
            fi
            tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
            rm -rf "${PKG_DIR}"
          done
          (
            cd dist
            sha256sum *.tar.gz > SHA256SUMS
          )

      - name: Release Binary (GitHub Release)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aether-sing-box ${{ github.ref_name }} (Linux amd64 & arm64)"
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            build/sing-box-linux-amd64
            build/sing-box-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-multiarch
          path: |
            build/sing-box-linux-amd64
            build/sing-box-linux-arm64
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 7
